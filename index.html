<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Малахат! ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stars-bg">
        <div class="stars-layer stars-1"></div>
        <div class="stars-layer stars-2"></div>
        <div class="stars-layer stars-3"></div>
    </div>

    <div id="matrix-screen" class="screen active">
        <canvas id="matrix-canvas"></canvas>
        <div id="matrix-content">
            <div id="countdown">3</div>
            <div id="matrix-text" class="hidden">H A P P Y</div>
            <button id="sound-btn">🔊 Включить звук</button>
        </div>
    </div>

    <div id="gallery-screen" class="screen hidden">
        <div class="book-container">
            <div class="book" id="book" onclick="turnPage()">
                
                <div class="page" id="p1">
                    <div class="front"><div class="page-content"><img src="images/1.jpeg" alt="1"></div><div class="page-footer" id="text-cover"></div></div>
                    <div class="back"><div class="page-content"><img src="images/2.jpeg" alt="2"></div><div class="page-footer" id="text-p1-back"></div></div>
                </div>

                <div class="page" id="p2">
                    <div class="front"><div class="page-content"><img src="images/3.jpeg" alt="3"></div><div class="page-footer" id="text-p2-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/4.jpeg" alt="4"></div><div class="page-footer" id="text-p2-back"></div></div>
                </div>

                <div class="page" id="p3">
                    <div class="front"><div class="page-content"><img src="images/5.jpeg" alt="5"></div><div class="page-footer" id="text-p3-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/6.jpeg" alt="6"></div><div class="page-footer" id="text-p3-back"></div></div>
                </div>

                <div class="page" id="p4">
                    <div class="front"><div class="page-content"><img src="images/7.jpeg" alt="7"></div><div class="page-footer" id="text-p4-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/8.jpeg" alt="8"></div><div class="page-footer" id="text-p4-back"></div></div>
                </div>

                <div class="page" id="p5">
                    <div class="front"><div class="page-content"><img src="images/9.jpeg" alt="9"></div><div class="page-footer" id="text-p5-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/10.jpeg" alt="10"></div><div class="page-footer" id="text-p5-back"></div></div>
                </div>

                <div class="page" id="p6">
                    <div class="front"><div class="page-content"><img src="images/11.jpeg" alt="11"></div><div class="page-footer" id="text-p6-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/12.jpeg" alt="12"></div><div class="page-footer" id="text-p6-back"></div></div>
                </div>

                <div class="page" id="p7">
                    <div class="front"><div class="page-content"><img src="images/13.jpeg" alt="13"></div><div class="page-footer" id="text-p7-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/14.jpeg" alt="14"></div><div class="page-footer" id="text-p7-back"></div></div>
                </div>

                <div class="page" id="p8">
                    <div class="front"><div class="page-content"><img src="images/15.jpeg" alt="15"></div><div class="page-footer" id="text-p8-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/16.jpeg" alt="16"></div><div class="page-footer" id="text-p8-back"></div></div>
                </div>

                <div class="page" id="p9">
                    <div class="front"><div class="page-content"><img src="images/17.jpeg" alt="17"></div><div class="page-footer" id="text-p9-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/18.jpeg" alt="18"></div><div class="page-footer" id="text-p9-back"></div></div>
                </div>

                <div class="page" id="p10">
                    <div class="front"><div class="page-content"><img src="images/19.jpeg" alt="19"></div><div class="page-footer" id="text-p10-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/20.jpeg" alt="20"></div><div class="page-footer" id="text-p10-back"></div></div>
                </div>
                
                <div class="page" id="p11">
                    <div class="front"><div class="page-content"><img src="images/21.jpeg" alt="21"></div><div class="page-footer" id="text-p11-front"></div></div>
                    <div class="back"><div class="page-content"><img src="images/1.jpeg" alt="1"></div><div class="page-footer" id="text-p11-back"></div></div>
                </div>

            </div>
        </div>
    </div>

    <div id="heart-screen" class="screen hidden">
        <h2 class="glow-text">❤️</h2>
        
        <div class="heart-wrap">
            <div class="photo-cell p1"><img src="images/1.jpeg" alt="h1"></div>
            <div class="photo-cell p2"><img src="images/2.jpeg" alt="h2"></div>
            <div class="photo-cell p3"><img src="images/3.jpeg" alt="h3"></div>
            <div class="photo-cell p4"><img src="images/4.jpeg" alt="h4"></div>
            <div class="photo-cell p5"><img src="images/5.jpeg" alt="h5"></div>
            <div class="photo-cell p6"><img src="images/6.jpeg" alt="h6"></div>
            <div class="photo-cell p7"><img src="images/7.jpeg" alt="h7"></div>
            <div class="photo-cell p8"><img src="images/8.jpeg" alt="h8"></div>
            <div class="photo-cell p9"><img src="images/9.jpeg" alt="h9"></div>
            <div class="photo-cell p10"><img src="images/10.jpeg" alt="h10"></div>
            <div class="photo-cell p11"><img src="images/11.jpeg" alt="h11"></div>
            <div class="photo-cell p12"><img src="images/12.jpeg" alt="h12"></div>
            <div class="photo-cell p13"><img src="images/13.jpeg" alt="h13"></div>
            <div class="photo-cell p14"><img src="images/14.jpeg" alt="h14"></div>
            <div class="photo-cell p15"><img src="images/15.jpeg" alt="h15"></div>
            <div class="photo-cell p16"><img src="images/16.jpeg" alt="h16"></div>
            
            <div class="photo-cell p17"><img src="images/17.jpeg" alt="h17"></div>
            <div class="photo-cell p18"><img src="images/18.jpeg" alt="h18"></div>
            <div class="photo-cell p19"><img src="images/19.jpeg" alt="h19"></div>
            <div class="photo-cell p20"><img src="images/20.jpeg" alt="h20"></div>
            <div class="photo-cell p21"><img src="images/21.jpeg" alt="h21"></div>
        </div>
    </div>

    <audio id="bg-music" autoplay loop>
        <source src="HBD.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
